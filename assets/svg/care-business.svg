    <linearGradient id="steel3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="50%" stop-color="#C9BEB4"/>
      <stop offset="100%" stop-color="#8C7E73"/>
    </linearGradient>
    <linearGradient id="orange3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F27924"/>
      <stop offset="100%" stop-color="#C9520B"/>
    </linearGradient>
  </defs>
  <rect width="240" height="280" rx="16" fill="url(#bg3)"/>
  <rect x="0" y="206" width="240" height="74" fill="#D7C0AA"/>
  <ellipse cx="122" cy="228" rx="80" ry="12" fill="#28160E" opacity="0.18"/>
