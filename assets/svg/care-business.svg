  <!-- Hose -->
  <path d="M158 124C192 124 200 170 186 210" stroke="#28160E" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Tank Body -->
  <rect x="74" y="108" width="90" height="96" rx="14" fill="url(#steel3)" stroke="#5E4D42" stroke-width="2"/>
  <!-- Top Motor Cap -->
  <path d="M78 108C78 86 96 74 119 74C142 74 160 86 160 108H78Z" fill="#28160E"/>
  <rect x="96" y="60" width="46" height="16" rx="6" fill="url(#orange3)"/>
