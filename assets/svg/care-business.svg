  <circle cx="82" cy="218" r="14" fill="#3B251A" stroke="#F5ECE4" stroke-width="3"/>
  <circle cx="156" cy="218" r="14" fill="#3B251A" stroke="#F5ECE4" stroke-width="3"/>
  <!-- Floor Gloss Reflection -->
