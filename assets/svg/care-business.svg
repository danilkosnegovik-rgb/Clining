<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none" role="img" aria-label="Профессиональная техника для бизнеса">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE4D7"/>
      <stop offset="100%" stop-color="#DFCBB8"/>
